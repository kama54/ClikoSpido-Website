ns. Le journal d'appels est utilisé pour les appels récents et manqués uniquement si ClikoSpido est choisi comme application Téléphone par défaut et que l'autorisation est accordée. L'affichage plein écran peut servir à présenter les appels entrants, notamment sur un appareil verrouillé. ClikoSpido n'est pas l'application SMS/MMS par défaut : il ouvre la messagerie existante.","Vos choix","Vous pouvez retirer les autorisations dans les réglages Android. Vous pouvez supprimer les données locales dans les paramètres Android de l'application ou désinstaller l'application, selon les possibilités du système.","Contact et éditeur","Application : ClikoSpido Launcher. Pour contacter l'éditeur au sujet de la confidentialité ou de l'assistance : gogostudio87@gmail.com.","Stockage local et durée de conservation","Les proches favoris (noms, numéros, références de photos), les réglages, le numéro et le texte d'urgence sont enregistrés localement sur le téléphone. Le code PIN du Mode Famille est stocké sous forme de dérivé cryptographique salé, et non en clair. Ces données restent sur l'appareil jusqu'à leur modification, l'effacement des données de l'application ou sa désinstallation. La sauvegarde Android des données de l'application est désactivée.","Achats, services tiers et transferts","Le Premium utilise Google Play Billing. Google Play traite les transactions selon ses propres règles ; l'application vérifie l'état des achats sans accéder aux coordonnées de carte bancaire. Les applications externes utilisées pour les SMS/MMS, photos ou appels peuvent traiter des données selon leurs propres politiques. Les fonctions locales de ClikoSpido ne transmettent pas les contacts ni le journal d'appels à l'éditeur.","Publicité et choix de l'utilisateur","ClikoSpido est sans publicité et n'emploie pas d'identifiant publicitaire pour cibler les utilisateurs. Vous pouvez gérer ou retirer les autorisations dans les réglages Android ; certaines fonctions nécessitant ces autorisations ne fonctionneront alors plus. La gestion des abonnements et achats se fait dans Google Play."],"en":["Privacy policy","Last updated: October 25, 2026.","How the app works","ClikoSpido Launcher provides a simplified Android home screen. Contacts and phone information needed for some features are processed on the device, subject to Android permissions. SMS/MMS and photos open in the phone's existing apps.","Data and permissions","The app may request access to contacts (names, phone numbers and photos), phone functions, call history and notifications. Call history is used for recent and missed calls only when ClikoSpido is the default Phone app and permission is granted. Full-screen notifications may display incoming calls, including on a locked device. ClikoSpido is not the default SMS/MMS app: it opens the existing messaging app.","Your choices","You can revoke permissions in Android settings. You can erase local app data through Android settings or uninstall the app, depending on the system.","Publisher and contact","App: ClikoSpido Launcher. For privacy or support inquiries, contact the publisher at gogostudio87@gmail.com.","Local storage and retention","Favorite people (names, phone numbers, photo references), settings, and the emergency number and message are stored locally on the device. The Family Mode PIN is stored as a salted cryptographic derivation, not plain text. These data remain until changed, the app's data are cleared, or the app is uninstalled. Android app-data backup is disabled.","Purchases, third parties and transfers","Premium uses Google Play Billing. Google Play processes transactions under its own terms; the app checks purchase status without accessing payment-card details. External apps used for SMS/MMS, photos or calls may process data under their own policies. ClikoSpido's local functions do not send contacts or call history to the publisher.","Advertising and user choices","ClikoSpido displays no advertisements and does not use an advertising ID for targeting. You can manage or revoke Android permissions in system settings; features requiring those permissions may stop working. Subscriptions and purchases are managed through Google Play."],"es":["Política de privacidad","Última actualización: 25 de octubre de 2026.","Funcionamiento","ClikoSpido Launcher ofrece una pantalla de inicio Android simplificada. Los contactos y los datos telefónicos necesarios se procesan en el dispositivo con los permisos de Android. Los SMS/MMS y las fotos se abren en las aplicaciones existentes.","Datos y permisos","La aplicación puede solicitar acceso a contactos (nombres, números y fotos), funciones telefónicas, registro de llamadas y notificaciones. El registro se usa para llamadas recientes y perdidas solo cuando ClikoSpido es la aplicación Teléfono predeterminada y se concede el permiso. La pantalla completa puede mostrar llamadas entrantes, incluso con el dispositivo bloqueado. Los SMS/MMS se abren en la aplicación de mensajería existente.","Tus opciones","Puedes revocar permisos en los ajustes de Android y borrar los datos locales o desinstalar la aplicación, según el sistema.","Editor y contacto","Aplicación: ClikoSpido Launcher. Para privacidad o asistencia, contacta con el editor: gogostudio87@gmail.com.","Almacenamiento local y conservación","Los contactos favoritos (nombres, números y referencias de fotos), ajustes, número y mensaje de emergencia se guardan localmente. El PIN del Modo Familia se almacena como derivación criptográfica con sal, no en texto claro. Los datos permanecen hasta que se modifican, borran los datos de la aplicación o se desinstala. La copia de seguridad de datos de Android está desactivada.","Compras, terceros y transferencias","Premium utiliza Google Play Billing. Google Play procesa las transacciones bajo sus condiciones; la aplicación comprueba las compras sin acceder a datos de tarjetas bancarias. Las aplicaciones externas de SMS/MMS, fotos o llamadas pueden tratar datos según sus políticas. Las funciones locales de ClikoSpido no envían contactos ni historial de llamadas al editor.","Publicidad y opciones","ClikoSpido no muestra anuncios ni usa el identificador publicitario para segmentación. Puedes revocar permisos en Android; algunas funciones dejarán de estar disponibles. Las compras y suscripciones se gestionan desde Google Play."],"it":["Informativa sulla privacy","Ultimo aggiornamento: 25 ottobre 2026.","Funzionamento","ClikoSpido Launcher offre una schermata iniziale Android semplificata. Contatti e dati telefonici necessari sono elaborati sul dispositivo con le autorizzazioni Android. SMS/MMS e foto si aprono nelle applicazioni esistenti.","Dati e autorizzazioni","L'app può richiedere accesso a contatti (nomi, numeri e foto), funzioni telefoniche, registro chiamate e notifiche. Il registro viene usato per chiamate recenti e perse solo se ClikoSpido è l'app Telefono predefinita e il permesso è concesso. Le notifiche a schermo intero possono mostrare chiamate in arrivo anche a schermo bloccato. Gli SMS/MMS si aprono nell'app di messaggistica esistente.","Le tue scelte","Puoi revocare le autorizzazioni nelle impostazioni Android, cancellare i dati locali o disinstallare l'app, secondo il sistema.","Editore e contatti","App: ClikoSpido Launcher. Per privacy o assistenza, contatta l'editore: gogostudio87@gmail.com.","Archiviazione locale e conservazione","Persone care (nomi, numeri e riferimenti alle foto), impostazioni, numero e testo di emergenza vengono memorizzati sul dispositivo. Il PIN della Modalità Famiglia è salvato come derivazione crittografica con salt, non in chiaro. I dati restano fino a modifica, cancellazione dei dati dell'app o disinstallazione. Il backup Android dei dati dell'app è disattivato.","Acquisti, terze parti e trasferimenti","Premium usa Google Play Billing. Google Play elabora gli acquisti secondo le proprie regole; l'app verifica lo stato degli acquisti senza accedere ai dati delle carte. Le app esterne per SMS/MMS, foto o chiamate possono trattare dati secondo le proprie informative. Le funzioni locali di ClikoSpido non inviano contatti o registro chiamate all'editore.","Pubblicità e scelte","ClikoSpido non mostra pubblicità e non usa identificatori pubblicitari per il targeting. Puoi revocare le autorizzazioni nelle impostazioni Android; alcune funzioni potrebbero non essere disponibili. Abbonamenti e acquisti si gestiscono in Google Play."],"de":["Datenschutzerklärung","Letzte Aktualisierung: 25. Oktober 2026.","Funktionsweise","ClikoSpido Launcher bietet einen vereinfachten Android-Startbildschirm. Erforderliche Kontakt- und Telefondaten werden mit entsprechenden Android-Berechtigungen auf dem Gerät verarbeitet. SMS/MMS und Fotos öffnen sich in vorhandenen Apps.","Daten und Berechtigungen","Die App kann Zugriff auf Kontakte (Namen, Nummern, Fotos), Telefonfunktionen, Anrufliste und Benachrichtigungen anfordern. Die Anrufliste wird für letzte und verpasste Anrufe nur genutzt, wenn ClikoSpido als Standard-Telefon-App festgelegt und die Berechtigung erteilt wurde. Vollbildbenachrichtigungen können eingehende Anrufe auch bei gesperrtem Gerät anzeigen. SMS/MMS werden in der vorhandenen Nachrichten-App geöffnet.","Ihre Möglichkeiten","Berechtigungen können in Android widerrufen werden. Lokale App-Daten können je nach System gelöscht werden; alternativ kann die App deinstalliert werden.","Anbieter und Kontakt","App: ClikoSpido Launcher. Kontakt für Datenschutz oder Support: gogostudio87@gmail.com.","Lokale Speicherung und Aufbewahrung","Angehörige (Namen, Nummern, Fotoreferenzen), Einstellungen sowie Notfallnummer und -text werden lokal gespeichert. Die Familienmodus-PIN wird als gesalzener kryptografischer Ableitungswert, nicht im Klartext, gespeichert. Die Daten bleiben bis zur Änderung, Löschung der App-Daten oder Deinstallation. Android-Backups der App-Daten sind deaktiviert.","Käufe, Drittanbieter und Übertragung","Premium verwendet Google Play Billing. Google Play verarbeitet Transaktionen nach eigenen Bedingungen; die App prüft den Kaufstatus ohne Zugriff auf Kreditkartendaten. Externe Apps für SMS/MMS, Fotos oder Anrufe verarbeiten Daten möglicherweise nach eigenen Regeln. Die lokalen ClikoSpido-Funktionen senden weder Kontakte noch Anruflisten an den Anbieter.","Werbung und Wahlmöglichkeiten","ClikoSpido zeigt keine Werbung und verwendet keine Werbe-ID für zielgerichtete Werbung. Android-Berechtigungen können widerrufen werden; betroffene Funktionen sind dann nicht nutzbar. Käufe und Abos werden über Google Play verwaltet."],"nl":["Privacybeleid","Laatst bijgewerkt: 25 oktober 2026.","Werking","ClikoSpido Launcher biedt een vereenvoudigd Android-startscherm. Benodigde contact- en telefoongegevens worden op het toestel verwerkt met Android-machtigingen. Sms/mms en foto's openen in bestaande apps.","Gegevens en machtigingen","De app kan toegang vragen tot contacten (namen, nummers en foto's), telefoonfuncties, oproepgeschiedenis en meldingen. Oproepgeschiedenis wordt alleen voor recente en gemiste oproepen gebruikt als ClikoSpido de standaardtelefoon-app is en toestemming is verleend. Meldingen op volledig scherm kunnen inkomende oproepen tonen, ook bij een vergrendeld toestel. Sms/mms opent in de bestaande berichtenapp.","Uw keuzes","U kunt machtigingen intrekken via Android-instellingen en lokale gegevens wissen of de app verwijderen, afhankelijk van het systeem.","Uitgever en contact","App: ClikoSpido Launcher. Voor privacyvragen of ondersteuning: gogostudio87@gmail.com.","Lokale opslag en bewaartermijn","Naasten (namen, nummers, fotoverwijzingen), instellingen, noodnummer en noodbericht worden lokaal opgeslagen. De pincode van de Familiemodus wordt als gezouten cryptografische afleiding bewaard, niet als leesbare tekst. Gegevens blijven totdat ze worden gewijzigd, appgegevens worden gewist of de app wordt verwijderd. Android-back-up van appgegevens is uitgeschakeld.","Aankopen, externe diensten en overdracht","Premium gebruikt Google Play Billing. Google Play verwerkt transacties volgens eigen voorwaarden; de app controleert aankopen zonder betaalkaartgegevens te ontvangen. Externe apps voor sms/mms, foto's of oproepen kunnen gegevens volgens eigen beleid verwerken. De lokale functies van ClikoSpido sturen geen contacten of oproepgeschiedenis naar de uitgever.","Advertenties en keuzes","ClikoSpido toont geen advertenties en gebruikt geen advertentie-ID voor gerichte reclame. U kunt machtigingen intrekken in Android-instellingen; sommige functies werken dan niet meer. Aankopen en abonnementen worden beheerd via Google Play."],"pt":["Política de privacidade","Última atualização: 25 de outubro de 2026.","Funcionamento","O ClikoSpido Launcher oferece um ecrã inicial Android simplificado. Contactos e dados telefónicos necessários são tratados no dispositivo com as permissões Android. SMS/MMS e fotografias abrem nas aplicações existentes.","Dados e permissões","A aplicação pode pedir acesso a contactos (nomes, números e fotografias), funções telefónicas, registo de chamadas e notificações. O registo é usado para chamadas recentes e não atendidas apenas se ClikoSpido for a aplicação Telefone predefinida e tiver autorização. As notificações em ecrã inteiro podem mostrar chamadas recebidas, inclusive com o dispositivo bloqueado. Os SMS/MMS abrem na aplicação habitual.","As suas opções","Pode revogar permissões nas definições Android e eliminar dados locais ou desinstalar a aplicação, consoante o sistema.","Editor e contacto","Aplicação: ClikoSpido Launcher. Para questões de privacidade ou apoio: gogostudio87@gmail.com.","Armazenamento local e conservação","Os familiares (nomes, números e referências de fotografias), definições, número e mensagem de emergência são guardados no dispositivo. O PIN do Modo Família é guardado como derivação criptográfica com sal, não em texto simples. Os dados ficam até serem alterados, apagados nas definições Android ou até à desinstalação. A cópia de segurança Android está desativada.","Compras, terceiros e transferências","O Premium usa Google Play Billing. O Google Play processa transações segundo as próprias condições; a aplicação verifica compras sem aceder a dados de cartões. Aplicações externas de SMS/MMS, fotos ou chamadas podem tratar dados segundo as suas políticas. As funções locais do ClikoSpido não enviam contactos nem registos de chamadas ao editor.","Publicidade e escolhas","O ClikoSpido não apresenta anúncios nem usa identificadores publicitários para segmentação. Pode revogar permissões nas definições Android; algumas funcionalidades deixam de funcionar. Compras e subscrições são geridas no Google Play."],"ar":["سياسة الخصوصية","آخر تحديث: 25 أكتوبر 2026.","كيفية عمل التطبيق","يوفر ClikoSpido Launcher شاشة Android رئيسية مبسطة. تُعالَج بيانات جهات الاتصال والهاتف اللازمة لبعض الميزات على الجهاز بعد منح أذونات Android. تُفتح الرسائل القصيرة والصور باستخدام التطبيقات الموجودة.","البيانات والأذونات","قد يطلب التطبيق إذن الوصول إلى جهات الاتصال (الأسماء والأرقام والصور)، ووظائف الهاتف وسجل المكالمات والإشعارات. يُستخدم السجل للمكالمات الأخيرة والفائتة فقط عند تعيين ClikoSpido كتطبيق الهاتف الافتراضي ومنحه الإذن. قد تُعرض المكالمات الواردة بملء الشاشة حتى عند قفل الجهاز. تُفتح رسائل SMS/MMS في تطبيق المراسلة الموجود.","خياراتك","يمكنك إلغاء الأذونات من إعدادات Android ومسح البيانات المحلية أو إزالة التطبيق وفقًا للنظام.","الناشر والتواصل","التطبيق: ClikoSpido Launcher. للاستفسار عن الخصوصية أو الدعم، تواصل مع الناشر: gogostudio87@gmail.com.","التخزين المحلي ومدة الاحتفاظ","تُحفظ أسماء وأرقام المقربين ومراجع صورهم والإعدادات ورقم ورسالة الطوارئ محليًا على الجهاز. يُخزّن رمز PIN الخاص بوضع العائلة كمشتق تشفيري مع ملح، وليس كنص صريح. تبقى البيانات حتى تعديلها أو مسح بيانات التطبيق أو إزالته. النسخ الاحتياطي لبيانات التطبيق عبر Android معطّل.","المشتريات والخدمات الخارجية","يستخدم Premium خدمة Google Play Billing. تعالج Google Play المعاملات وفق شروطها؛ يتحقق التطبيق من حالة الشراء دون الوصول إلى تفاصيل البطاقة المصرفية. قد تعالج تطبيقات الرسائل والصور والمكالمات الخارجية البيانات وفق سياساتها. لا ترسل ميزات ClikoSpido المحلية جهات الاتصال أو سجل المكالمات إلى الناشر.","الإعلانات وخيارات المستخدم","لا يعرض ClikoSpido إعلانات ولا يستخدم المعرّف الإعلاني للاستهداف. يمكنك سحب الأذونات من إعدادات Android، وقد تتوقف الوظائف المعتمدة عليها. تُدار المشتريات والاشتراكات عبر Google Play."],"ja":["プライバシーポリシー","最終更新日：2026年10月25日。","アプリの仕組み","ClikoSpido LauncherはAndroidのホーム画面を簡単にします。必要な連絡先と電話情報はAndroidの権限に基づき端末内で処理されます。SMS/MMSと写真は既存のアプリで開きます。","データと権限","アプリは連絡先（名前、電話番号、写真）、電話機能、通話履歴、通知へのアクセス許可を求める場合があります。通話履歴は、ClikoSpidoを既定の電話アプリに設定し、許可した場合に限り最近の通話や不在着信に使用されます。着信はロック画面を含め全画面表示される場合があります。SMS/MMSは既存のメッセージアプリで開きます。","ユーザーの選択","Androidの設定から権限を取り消せます。システムに応じてアプリデータを削除したり、アプリをアンインストールしたりできます。","発行者とお問い合わせ","アプリ：ClikoSpido Launcher。プライバシーやサポートのお問い合わせ先：gogostudio87@gmail.com。","端末内の保存と保持期間","お気に入りの連絡先（名前、電話番号、写真への参照）、設定、緊急連絡先とメッセージは端末内に保存されます。ファミリーモードのPINは平文ではなく、ソルト付きの暗号学的導出値として保存されます。変更、アプリデータの消去、アンインストールまで保持され、Androidのアプリデータバックアップは無効です。","購入・外部サービス・データ送信","PremiumはGoogle Play Billingを利用します。取引はGoogle Playの規約に従い処理され、アプリはカード情報にアクセスせず購入状態を確認します。SMS/MMS、写真、通話に使う外部アプリは各自の方針でデータを処理する場合があります。ClikoSpidoのローカル機能から連絡先や通話履歴が発行者に送信されることはありません。","広告とユーザーの選択","ClikoSpidoは広告を表示せず、ターゲティングに広告IDを使用しません。Androidの設定で権限を取り消せますが、一部機能は利用できなくなります。購入や定期購入はGoogle Playで管理します。"],"ko":["개인정보 처리방침","최종 업데이트: 2026년 10월 25일.","앱 작동 방식","ClikoSpido Launcher는 Android 홈 화면을 단순화합니다. 필요한 연락처 및 전화 정보는 Android 권한에 따라 기기에서 처리됩니다. SMS/MMS 및 사진은 기존 앱에서 열립니다.","데이터 및 권한","앱은 연락처(이름, 번호, 사진), 전화 기능, 통화 기록 및 알림 권한을 요청할 수 있습니다. 통화 기록은 ClikoSpido가 기본 전화 앱이고 사용자가 권한을 허용한 경우 최근 통화와 부재중 전화에만 사용됩니다. 전체 화면 알림은 잠금 화면에서도 수신 전화를 표시할 수 있습니다. SMS/MMS는 기존 메시지 앱에서 열립니다.","사용자 선택","Android 설정에서 권한을 취소할 수 있으며 시스템에 따라 앱 데이터를 삭제하거나 앱을 제거할 수 있습니다.","게시자 및 문의","앱: ClikoSpido Launcher. 개인정보 또는 지원 문의: gogostudio87@gmail.com.","로컬 저장 및 보관","즐겨찾는 사람의 이름, 번호, 사진 참조, 설정, 긴급 번호와 메시지는 기기에 저장됩니다. 가족 모드 PIN은 평문이 아닌 솔트가 적용된 암호학적 파생값으로 저장됩니다. 수정, 앱 데이터 삭제 또는 앱 제거 시까지 보관되며 Android 앱 데이터 백업은 비활성화되어 있습니다.","구매, 외부 서비스 및 전송","Premium은 Google Play Billing을 사용합니다. 거래는 Google Play 정책에 따라 처리되며 앱은 카드 정보에 접근하지 않고 구매 상태를 확인합니다. SMS/MMS, 사진 및 전화용 외부 앱은 자체 정책에 따라 데이터를 처리할 수 있습니다. ClikoSpido의 로컬 기능은 연락처나 통화 기록을 게시자에게 전송하지 않습니다.","광고 및 사용자 선택","ClikoSpido는 광고를 표시하지 않으며 광고 ID를 타겟팅에 사용하지 않습니다. Android 설정에서 권한을 취소할 수 있지만 관련 기능이 작동하지 않을 수 있습니다. 구매와 구독은 Google Play에서 관리합니다."]};function change(){let lang=document.getElementById('language').value;const a=V[lang]||V.en;document.getElementById('content-title').textContent=a[0];for(let i=1;i<a.length;i++){let el=document.getElementById('content-'+(i-1));if(el)el.textContent=a[i]}document.title=a[0]+' — ClikoSpido Launcher';}change();document.getElementById('language').addEventListener('change',change);})();</script></body></html>
