Les réglages de personnalisation sont enregistrés localement lorsqu'aucune synchronisation n'est nécessaire. Les achats Premium sont traités par Google Play Billing.","Vos choix","Vous pouvez retirer les autorisations dans les réglages Android. Vous pouvez supprimer les données locales dans les paramètres Android de l'application ou désinstaller l'application, selon les possibilités du système.","Contact et éditeur","Les coordonnées de l'éditeur seront ajoutées avant la publication commerciale. Consultez la page Contact."],"en":["Privacy policy","Last updated: October 25, 2026. This document must be verified before commercial release.","How the app works","ClikoSpido Launcher provides a simplified Android home screen. Contacts and phone information needed for some features are processed on the device, subject to Android permissions. SMS/MMS and photos open in the phone's existing apps.","Data and permissions","The app may request access to contacts and phone features required for calling and showing loved ones. Call log access depends on the default phone app role and granted permissions. Customization settings are stored locally when synchronization is unnecessary. Premium purchases are processed through Google Play Billing.","Your choices","You can revoke permissions in Android settings. You can erase local app data through Android settings or uninstall the app, depending on the system.","Publisher and contact","The publisher's contact details will be added before commercial release. See the Contact page."],"es":["Política de privacidad","Última actualización: 25 de octubre de 2026. Documento pendiente de revisión antes del lanzamiento comercial.","Funcionamiento","ClikoSpido Launcher ofrece una pantalla de inicio Android simplificada. Los contactos y los datos telefónicos necesarios se procesan en el dispositivo con los permisos de Android. Los SMS/MMS y las fotos se abren en las aplicaciones existentes.","Datos y permisos","La aplicación puede solicitar acceso a contactos y funciones telefónicas para llamar y mostrar familiares. El acceso al registro de llamadas depende de ser la aplicación de teléfono predeterminada y de los permisos concedidos. Los ajustes se guardan localmente cuando no se necesita sincronización. Las compras Premium se procesan mediante Google Play Billing.","Tus opciones","Puedes revocar permisos en los ajustes de Android y borrar los datos locales o desinstalar la aplicación, según el sistema.","Editor y contacto","Los datos de contacto del editor se añadirán antes del lanzamiento comercial. Consulta Contacto."],"it":["Informativa sulla privacy","Ultimo aggiornamento: 25 ottobre 2026. Documento da verificare prima della pubblicazione commerciale.","Funzionamento","ClikoSpido Launcher offre una schermata iniziale Android semplificata. Contatti e dati telefonici necessari sono elaborati sul dispositivo con le autorizzazioni Android. SMS/MMS e foto si aprono nelle applicazioni esistenti.","Dati e autorizzazioni","L'app può richiedere l'accesso a contatti e funzioni telefoniche per chiamate e contatti preferiti. Il registro chiamate richiede il ruolo di app Telefono predefinita e le relative autorizzazioni. Le impostazioni sono salvate localmente quando non serve sincronizzazione. Gli acquisti Premium passano tramite Google Play Billing.","Le tue scelte","Puoi revocare le autorizzazioni nelle impostazioni Android, cancellare i dati locali o disinstallare l'app, secondo il sistema.","Editore e contatti","I recapiti dell'editore saranno aggiunti prima del lancio commerciale. Consulta Contatti."],"de":["Datenschutzerklärung","Letzte Aktualisierung: 25. Oktober 2026. Vor dem kommerziellen Start zu überprüfen.","Funktionsweise","ClikoSpido Launcher bietet einen vereinfachten Android-Startbildschirm. Erforderliche Kontakt- und Telefondaten werden mit entsprechenden Android-Berechtigungen auf dem Gerät verarbeitet. SMS/MMS und Fotos öffnen sich in vorhandenen Apps.","Daten und Berechtigungen","Die App kann Kontakte und Telefonfunktionen für Anrufe und Angehörige anfordern. Der Zugriff auf die Anrufliste setzt die Rolle als Standard-Telefon-App und entsprechende Berechtigungen voraus. Einstellungen werden lokal gespeichert, wenn keine Synchronisierung nötig ist. Premium-Käufe laufen über Google Play Billing.","Ihre Möglichkeiten","Berechtigungen können in Android widerrufen werden. Lokale App-Daten können je nach System gelöscht werden; alternativ kann die App deinstalliert werden.","Anbieter und Kontakt","Die Kontaktdaten des Anbieters werden vor dem kommerziellen Start ergänzt. Siehe Kontakt."],"nl":["Privacybeleid","Laatst bijgewerkt: 25 oktober 2026. Controleer dit document vóór commerciële publicatie.","Werking","ClikoSpido Launcher biedt een vereenvoudigd Android-startscherm. Benodigde contact- en telefoongegevens worden op het toestel verwerkt met Android-machtigingen. Sms/mms en foto's openen in bestaande apps.","Gegevens en machtigingen","De app kan toegang vragen tot contacten en telefoonfuncties voor bellen en het tonen van naasten. Toegang tot oproepgeschiedenis vereist de rol van standaardtelefoon-app en toestemming. Instellingen worden lokaal opgeslagen als synchronisatie niet nodig is. Premiumaankopen verlopen via Google Play Billing.","Uw keuzes","U kunt machtigingen intrekken via Android-instellingen en lokale gegevens wissen of de app verwijderen, afhankelijk van het systeem.","Uitgever en contact","Contactgegevens van de uitgever worden voor de commerciële lancering toegevoegd. Zie Contact."],"pt":["Política de privacidade","Última atualização: 25 de outubro de 2026. Documento a verificar antes do lançamento comercial.","Funcionamento","O ClikoSpido Launcher oferece um ecrã inicial Android simplificado. Contactos e dados telefónicos necessários são tratados no dispositivo com as permissões Android. SMS/MMS e fotografias abrem nas aplicações existentes.","Dados e permissões","A aplicação pode solicitar acesso aos contactos e funções telefónicas para chamadas e familiares. O registo de chamadas depende de ser a aplicação Telefone predefinida e das permissões concedidas. As definições são guardadas localmente quando não é necessária sincronização. As compras Premium são processadas pelo Google Play Billing.","As suas opções","Pode revogar permissões nas definições Android e eliminar dados locais ou desinstalar a aplicação, consoante o sistema.","Editor e contacto","Os contactos oficiais do editor serão acrescentados antes do lançamento comercial. Consulte Contacto."],"ar":["سياسة الخصوصية","آخر تحديث: 25 أكتوبر 2026. يجب مراجعة هذه الوثيقة قبل الإطلاق التجاري.","كيفية عمل التطبيق","يوفر ClikoSpido Launcher شاشة Android رئيسية مبسطة. تُعالَج بيانات جهات الاتصال والهاتف اللازمة لبعض الميزات على الجهاز بعد منح أذونات Android. تُفتح الرسائل القصيرة والصور باستخدام التطبيقات الموجودة.","البيانات والأذونات","قد يطلب التطبيق الوصول إلى جهات الاتصال ووظائف الهاتف للمكالمات وعرض المقربين. يتطلب الوصول إلى سجل المكالمات تعيين التطبيق كهاتف افتراضي ومنحه الأذونات. تُحفظ إعدادات التخصيص محليًا عندما لا تلزم المزامنة. تتم مشتريات Premium عبر Google Play Billing.","خياراتك","يمكنك إلغاء الأذونات من إعدادات Android ومسح البيانات المحلية أو إزالة التطبيق وفقًا للنظام.","الناشر والتواصل","ستُضاف بيانات اتصال الناشر قبل الإطلاق التجاري. راجع صفحة الاتصال."],"ja":["プライバシーポリシー","最終更新日：2026年10月25日。商用公開前に内容を確認する必要があります。","アプリの仕組み","ClikoSpido LauncherはAndroidのホーム画面を簡単にします。必要な連絡先と電話情報はAndroidの権限に基づき端末内で処理されます。SMS/MMSと写真は既存のアプリで開きます。","データと権限","通話や家族の表示のため連絡先および電話機能へのアクセスを求める場合があります。通話履歴へのアクセスには既定の電話アプリとしての設定と権限が必要です。同期不要な設定は端末内に保存されます。Premium購入はGoogle Play Billingで処理されます。","ユーザーの選択","Androidの設定から権限を取り消せます。システムに応じてアプリデータを削除したり、アプリをアンインストールしたりできます。","発行者とお問い合わせ","商用公開前に発行者の連絡先を追記します。お問い合わせページをご覧ください。"],"ko":["개인정보 처리방침","최종 업데이트: 2026년 10월 25일. 상용 출시 전에 검토해야 하는 문서입니다.","앱 작동 방식","ClikoSpido Launcher는 Android 홈 화면을 단순화합니다. 필요한 연락처 및 전화 정보는 Android 권한에 따라 기기에서 처리됩니다. SMS/MMS 및 사진은 기존 앱에서 열립니다.","데이터 및 권한","통화 및 가족 표시를 위해 연락처와 전화 기능 권한을 요청할 수 있습니다. 통화 기록에 접근하려면 기본 전화 앱 역할과 권한이 필요합니다. 동기화가 필요하지 않은 설정은 기기에 저장됩니다. Premium 구매는 Google Play Billing을 통해 처리됩니다.","사용자 선택","Android 설정에서 권한을 취소할 수 있으며 시스템에 따라 앱 데이터를 삭제하거나 앱을 제거할 수 있습니다.","게시자 및 문의","상용 출시 전에 게시자의 연락처를 추가합니다. 문의 페이지를 참조하세요."]};function change(){let lang=document.getElementById('language').value;const a=V[lang]||V.en;document.getElementById('content-title').textContent=a[0];for(let i=1;i<a.length;i++){let el=document.getElementById('content-'+(i-1));if(el)el.textContent=a[i]}document.title=a[0]+' — ClikoSpido Launcher';}change();document.getElementById('language').addEventListener('change',change);})();</script></body></html>
